# XcodeGen spec for the CJ iOS app. The .xcodeproj is generated from this file (in CI and locally) and
# is not committed:  cd cj-ios && xcodegen generate
name: CJ
options:
  bundleIdPrefix: com.airamsoto
  deploymentTarget:
    iOS: "17.2"  # minimum for Meta's Wearables Device Access Toolkit
  createIntermediateGroups: true

packages:
  # Meta Wearables Device Access Toolkit (glasses camera). Docs ask for Xcode 26.4+, but 1.0.1 builds with 26.1.
  MWDAT:
    url: https://github.com/meta/meta-wearables-dat-ios
    exactVersion: 1.0.1

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "11"
    SWIFT_VERSION: "5.0"

targets:
  CJ:
    type: application
    platform: iOS
    sources:
      - path: CJ
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.airamsoto.cj
        INFOPLIST_FILE: CJ/Info.plist
        TARGETED_DEVICE_FAMILY: "1"  # iPhone
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - package: MWDAT
        product: MWDATCore
      - package: MWDAT
        product: MWDATCamera
