name: ios

# Builds the CJ iPhone app and uploads an unsigned .ipa, ready to sign and install with Sideloadly.
on:
  workflow_dispatch:
  push:
    paths: ['cj-ios/**', '.github/workflows/ios.yml']
  pull_request:
    paths: ['cj-ios/**', '.github/workflows/ios.yml']

jobs:
  build:
    runs-on: macos-15-intel  # arm64 macOS runners were stuck in the queue (capacity constraints)
    defaults:
      run:
        working-directory: cj-ios
    steps:
      - uses: actions/checkout@v4

      - name: Select the newest Xcode
        run: |
          ls -d /Applications/Xcode*.app
          XCODE=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
          # Shown on the run page (and readable without signing in): which Xcodes this runner offers.
          echo "::notice title=Xcode::using $(xcodebuild -version | head -1); available: $(ls -d /Applications/Xcode_*.app | xargs -n1 basename | tr '\n' ' ')"

      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build (unsigned)
        run: |
          xcodebuild -project CJ.xcodeproj -scheme CJ -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: Package the .ipa
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/CJ.app Payload/
          zip -qry CJ-unsigned.ipa Payload
          ls -lh CJ-unsigned.ipa

      # Same app with Apple Health: the HealthKit entitlement is signed in ad hoc so Sideloadly asks Apple for it.
      - name: Build and package the Salud (Apple Health) .ipa
        run: |
          xcodebuild -project CJ.xcodeproj -scheme CJ -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build-salud \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" CJ_HEALTHKIT=YES \
            build
          rm -rf Payload && mkdir Payload
          cp -R build-salud/Build/Products/Release-iphoneos/CJ.app Payload/
          codesign -f -s - --entitlements CJ/CJHealth.entitlements Payload/CJ.app
          zip -qry CJ-salud.ipa Payload
          ls -lh CJ-salud.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: CJ-ios-unsigned
          path: |
            cj-ios/CJ-unsigned.ipa
            cj-ios/CJ-salud.ipa
          retention-days: 14
