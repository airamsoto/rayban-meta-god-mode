name: ios

# Builds the CJ iPhone app and uploads an unsigned .ipa, ready to sign and install with Sideloadly.
on:
  workflow_dispatch:
  push:
    paths: ['cj-ios/**', '.github/workflows/ios.yml']
  pull_request:
    paths: ['cj-ios/**', '.github/workflows/ios.yml']

jobs:
  build:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: cj-ios
    steps:
      - uses: actions/checkout@v4

      - name: Select the newest Xcode
        run: |
          ls -d /Applications/Xcode*.app
          XCODE=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build (unsigned)
        run: |
          xcodebuild -project CJ.xcodeproj -scheme CJ -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: Package the .ipa
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/CJ.app Payload/
          zip -qry CJ-unsigned.ipa Payload
          ls -lh CJ-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: CJ-ios-unsigned
          path: cj-ios/CJ-unsigned.ipa
          retention-days: 14
